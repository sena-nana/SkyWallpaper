[workspace]
members = [
    "crates/sky-core",
    "crates/sky-gpu",
    "crates/weather",
    "crates/wallpaper-host",
    "crates/skywallpaper",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
authors = ["Sena"]

[workspace.dependencies]
sky-core = { path = "crates/sky-core" }
sky-gpu = { path = "crates/sky-gpu" }
weather = { path = "crates/weather" }
wallpaper-host = { path = "crates/wallpaper-host" }
anyhow = "1"
bytemuck = { version = "1.25", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
naga = { version = "30.0.1", default-features = false, features = ["wgsl-in"] }
pollster = "1"
raw-window-handle = "0.6.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
tray-icon = "0.25"
# NanaUI pins ureq =3.4.0; a looser spec here would fail to unify.
ureq = { version = "=3.4.0", default-features = false, features = ["rustls"] }
wgpu = "30.0.1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Globalization",
    "Win32_UI_WindowsAndMessaging",
] }
# Must match NanaUI's winit git sha (0.31-line). crates.io 0.30 is a different API.
winit = { git = "https://github.com/rust-windowing/winit", rev = "874a1e31f194d11313c1ac133b28037b99db3e19", default-features = false }
